# tbox server (runs on the VPS).
#
# Easiest: don't write this by hand. Generate it (keys + first client + token):
#   tbox init-server -c server.yaml --addr <vps-host>
#   tbox add-client  -c server.yaml <name>     # add more clients, prints tokens
# This example is for reference / manual editing.

# Public L4 SNI router address. Owns 443: SNI=mimic -> REALITY proxy;
# SNI=a published domain -> TLS terminate + reverse proxy; else -> REALITY fallback.
listen: ":443"

# Public host clients dial (baked into emitted tokens). Hostname or IP of this VPS.
server_addr: "vps.example.com"

# REALITY handshake/camouflage target. Must support TLS 1.3 + HTTP/2 and be
# reachable from this VPS. To outside observers the tunnel looks like HTTPS to it.
mimic: "www.microsoft.com:443"

# REALITY keypair + short id (from `tbox gen-keypair`).
reality_private_key: "REPLACE_ME"
reality_public_key: "REPLACE_ME"   # optional; derived from private key if omitted
short_id: "REPLACE_ME"

# Localhost-only internals. The embedded sing-box REALITY inbound binds
# reality_inbound_addr (fronted by the L4 router); the control plane listens on
# control_addr (reached by clients over the tunnel).
control_addr: "127.0.0.1:8443"
reality_inbound_addr: "127.0.0.1:8444"

log_level: "info"

# Authorized clients. Each gets its own VLESS UUID (== its token).
clients:
  - name: "client-1"
    uuid: "REPLACE_ME"
  # - name: "client-2"
  #   uuid: "..."

# OPTIONAL: certificates the server provides for published hosts, so clients
# don't have to ship their own (avoids client-side cert dependencies). Covered
# names are read from the cert SAN, so one wildcard cert works for many hosts.
# certs:
#   - cert_path: "/etc/tbox/dc.example.com.crt"   # SAN: dc.example.com, *.dc.example.com
#     key_path:  "/etc/tbox/dc.example.com.key"

# OPTIONAL: services the SERVER publishes directly. Same schema as a client's
# `publish:`, but the server dials the upstream itself (no tunnel, no co-located
# client) — use this to expose a service running on the VPS without a loopback
# tbox client. The host must be covered by a cert above. socks5 is not supported
# here (it needs a client-run SOCKS5 server); use https/wss/tcp.
# publish:
#   - url: "https://dc.example.com/"        # HTTP reverse proxy to a local service
#     upstream: "127.0.0.1:3000"
#   - url: "https://app.dc.example.com/admin/"
#     upstream: "127.0.0.1:8080"
#     strip_prefix: true                    # /admin/x -> /x on the upstream
#   - url: "wss://app.dc.example.com/tunnel/ssh"   # raw TCP as a WebSocket
#     upstream: "127.0.0.1:22"
#   - url: "tcp://ssh.dc.example.com"        # TLS-terminated raw TCP (e.g. ssh)
#     upstream: "127.0.0.1:22"
#     allow: ["203.0.113.0/24"]             # source-IP whitelist (empty = allow all)

# OPTIONAL: L2 tunnel hub (absorbs the udpt.py bridge as a native Go switch).
# The server creates a TAP device and acts as a learning bridge whose ports are
# each client's carrier stream plus this local TAP. Requires CAP_NET_ADMIN.
# tun:
#   enable: true
#   tap_name: "tbox0"
#   pool_v4: "10.42.0.0/24"        # virtual subnet; gateway defaults to .1
#   # gateway: "10.42.0.1"
#   mtu: 1448
#   enable_nat: true               # MASQUERADE pool_v4 for global egress
#   wan_interface: "eth0"          # required when enable_nat
#   enable_passthrough: true       # IPv6: add /80 routes + restart ndppd
#   # ipv6_prefix: "2001:db8:0:42::/80"

# OPTIONAL: fail2ban-style banning of the HTTP publishing path. tbox watches
# upstream responses (it sees the real client IP + status) and bans abusive
# sources. Defaults below; all fields optional once enable is set.
# ban:
#   enable: true
#   methods: ["POST"]          # request methods that count toward a failure
#   statuses: [401, 403]       # ... when answered with these statuses
#   # path: "/websh/api/login" # optional: only count failures under this prefix
#   threshold: 5               # failures from one IP within window -> ban it
#   window: "10m"
#   ban_duration: "1h"
#   subnet_threshold: 2        # distinct banned IPs in a /24 -> ban the /24 (0=off)
#   exempt: ["203.0.113.0/24"] # sources never counted or banned
