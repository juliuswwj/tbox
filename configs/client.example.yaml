# tbox client (runs on the local machine behind the monitored gateway).

# Token from `tbox add-client` / `tbox gen-token` on the server.
token: "tbox://REPLACE_ME"

# Local SOCKS5H (also SOCKS4/HTTP via the mixed inbound) for forward proxying.
# Point apps here: curl -x socks5h://127.0.0.1:1080 https://example.com
socks_listen: "127.0.0.1:1080"

# Local admin API for runtime whitelist changes (used by `tbox whitelist`).
admin_listen: "127.0.0.1:9090"

log_level: "info"

# Certificates this client provides for its published hosts. OPTIONAL: omit this
# whole section if the SERVER provides the cert (see server.yaml `certs:`).
# The covered names are read from the cert's SAN — one wildcard cert
# [dc.example.com, *.dc.example.com] covers every host below.
certs:
  - cert_path: "/etc/tbox/dc.example.com.crt"
    key_path:  "/etc/tbox/dc.example.com.key"

# Services to publish. The URL scheme picks the mode:
#   https://host/path  -> HTTP reverse proxy (optional rewriting)
#   wss://host/path    -> WebSocket bridged to a raw TCP upstream
#   tcp://host         -> TLS terminated by SNI, then raw TCP (e.g. ssh)
# These can all coexist under one cert, even on the same host by path.
publish:
  # Full site at the apex.
  - url: "https://dc.example.com/"
    upstream: "127.0.0.1:3000"

  # Sub-location on a subdomain, with nginx-style rewriting.
  - url: "https://app.dc.example.com/location/"
    upstream: "127.0.0.1:8080"
    strip_prefix: true            # /location/x -> /x on the upstream
    set_host: "app.internal"
    request_headers: { X-Tbox: "1" }
    response_headers: { Server: "" }   # "" deletes the header

  # Raw TCP service exposed as a WebSocket under the same host.
  - url: "wss://app.dc.example.com/tunnel/ssh"
    upstream: "127.0.0.1:22"

  # TLS-terminated raw TCP on a whole subdomain (TLS+TCP, e.g. ssh over TLS).
  - url: "tcp://ssh.dc.example.com"
    upstream: "127.0.0.1:22"
    allow: ["203.0.113.0/24"]     # source-IP whitelist (empty = allow all)

  # A restricted SOCKS5 proxy: the client is the SOCKS5 server and only dials
  # destinations on allow_dest (so it is NOT an open proxy). No upstream.
  - url: "socks5://proxy.dc.example.com"
    allow: ["203.0.113.0/24"]     # who may connect (source IP)
    allow_dest:                   # where they may connect to (empty = deny all)
      - "10.0.0.0/8"              #   any IP in the internal range
      - "*.internal.example.com"  #   any host under this domain
      - "git.example.com:22"      #   one host:port
