name: test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # Deterministic gate: lint, vet, build, and the full test suite. The
  # end-to-end test drives a real VLESS-REALITY tunnel against a local mimic
  # (TLS 1.3 + HTTP/2), so it needs no external network and runs here too.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          #$XBH_AI_PATCH_START
          #go vet -tags with_utls ./...
          #$XBH_AI_PATCH_MODIFY
          go vet -tags 'with_utls with_quic' ./...
          #$XBH_AI_PATCH_END

      - name: build
        run: |
          #$XBH_AI_PATCH_START
          #go build -tags with_utls ./...
          #$XBH_AI_PATCH_MODIFY
          go build -tags 'with_utls with_quic' ./...
          #$XBH_AI_PATCH_END

      - name: tests
        run: |
          #$XBH_AI_PATCH_START
          #go test -tags with_utls -race -count=1 ./...
          #$XBH_AI_PATCH_MODIFY
          go test -tags 'with_utls with_quic' -race -count=1 ./...
          #$XBH_AI_PATCH_END
