name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BIN=tbox
          [ "$GOOS" = windows ] && BIN=tbox.exe
          PKG="tbox_${VERSION}_${GOOS}_${GOARCH}"

          mkdir -p "dist/$PKG"
          go build -tags with_utls -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/$PKG/$BIN" ./cmd/tbox
          cp README.md "dist/$PKG/" 2>/dev/null || true
          cp -r configs deploy "dist/$PKG/" 2>/dev/null || true

          cd dist
          if [ "$GOOS" = windows ]; then
            zip -r "${PKG}.zip" "$PKG"
            sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"
          else
            tar czf "${PKG}.tar.gz" "$PKG"
            sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true

  # Android client APK, built from the same release tag. Produces app-debug.apk
  # (which carries the Carrier tun client, libbox runtime, and the tbox gomobile
  # helper). The APK is large (several ABI .so files) but is the only artifact a
  # user needs on-device.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;27.1.12297006

      - name: Set NDK env
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install gomobile toolchain
        # The go.mod already carries a `tool golang.org/x/mobile/cmd/gobind`
        # directive, so we just install the gomobile/gobind binaries above —
        # `go install` picks the version pinned by the tool line automatically.
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Build AAR (gomobile bind)
        run: make android

      - name: Build debug APK (gradlew assembleDebug)
        run: make android-apk

      - name: Stage APK with a release-tagged name
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/tbox_${VERSION}_android.apk"
          sha256sum "dist/tbox_${VERSION}_android.apk" > \
                    "dist/tbox_${VERSION}_android.apk.sha256"

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tbox_${{ github.ref_name }}_android.apk
            dist/tbox_${{ github.ref_name }}_android.apk.sha256
          generate_release_notes: true