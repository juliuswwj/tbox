name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          BIN=tbox
          [ "$GOOS" = windows ] && BIN=tbox.exe
          PKG="tbox_${VERSION}_${GOOS}_${GOARCH}"

          mkdir -p "dist/$PKG"
          go build -tags with_utls -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/$PKG/$BIN" ./cmd/tbox
          cp README.md "dist/$PKG/" 2>/dev/null || true
          cp -r configs deploy "dist/$PKG/" 2>/dev/null || true

          cd dist
          if [ "$GOOS" = windows ]; then
            zip -r "${PKG}.zip" "$PKG"
            sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"
          else
            tar czf "${PKG}.tar.gz" "$PKG"
            sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
